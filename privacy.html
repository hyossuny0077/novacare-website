<main class="page"><div class="wrap prose">
  <h1>개인정보처리방침</h1>
  <p class="notice dev" style="margin-top:24px">초안 자리입니다. 법무·보안 검토를 거친 실제 처리방침으로 교체한 뒤 게시해야 합니다.</p>
  <h2>문의 접수 시 수집하는 항목</h2>
  <ul><li>기관명, 담당자 이름, 이메일, 전화번호(선택), 문의 내용</li></ul>
  <h2>수집·이용 목적</h2>
  <p>도입 상담, 데모 신청, 제휴 문의에 대한 응대.</p>
  <h2>보관 기간·위탁·파기</h2>
  <p>보관 기간, 처리 위탁 여부, 파기 절차는 확정 후 이곳에 기재합니다.</p>
</div></main>
